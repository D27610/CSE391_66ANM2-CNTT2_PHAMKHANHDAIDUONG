<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Về Nhà 2 - Multi-step Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* --- Thanh tiến trình (Progress Bar) --- */
        .progress-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 30px;
        }

        /* Dòng kẻ xám chạy ngang */
        .progress-container::before {
            content: "";
            background-color: #e0e0e0;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 4px;
            width: 100%;
            z-index: 1;
        }

        /* Dòng kẻ xanh thể hiện tiến trình */
        .progress-line {
            background-color: #007bff;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 4px;
            width: 0%; /* Sẽ thay đổi bằng JS */
            z-index: 1;
            transition: width 0.4s ease;
        }

        /* Các vòng tròn bước */
        .step-circle {
            background-color: #fff;
            color: #999;
            border: 3px solid #e0e0e0;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 2;
            transition: all 0.4s ease;
        }

        .step-circle.active {
            border-color: #007bff;
            color: #007bff;
        }

        .step-circle.completed {
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
        }

        /* --- Các bước form --- */
        .form-step {
            display: none; /* Mặc định ẩn tất cả các bước */
            animation: fadeIn 0.5s;
        }

        .form-step.active {
            display: block; /* Chỉ hiện bước active */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Style cho Input --- */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #007bff;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }
        .radio-group label {
            font-weight: normal;
            display: inline;
            color: #333;
        }

        /* Validation Colors */
        .input-error { border: 2px solid #dc3545 !important; }
        .input-success { border: 2px solid #28a745 !important; }
        .error-message {
            color: #dc3545;
            font-size: 0.85em;
            display: none;
            margin-top: 5px;
        }

        /* --- Nút bấm --- */
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-prev {
            background-color: #6c757d;
            color: white;
            /* Ẩn nút prev ở bước đầu tiên */
            visibility: hidden; 
        }
        .btn-prev:hover { background-color: #5a6268; }

        .btn-next, .btn-submit {
            background-color: #007bff;
            color: white;
            /* Nút submit bị vô hiệu hóa mặc định */
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Khi nút được enable */
        .btn-next.enabled, .btn-submit.enabled {
            opacity: 1;
            cursor: pointer;
        }
        .btn-next.enabled:hover { background-color: #0056b3; }
        .btn-submit.enabled { background-color: #28a745; }
        .btn-submit.enabled:hover { background-color: #218838; }

        /* --- Bước 3: Xác nhận thông tin --- */
        .summary-box {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e9ecef;
        }
        .summary-item {
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }
        .summary-item strong {
            display: inline-block;
            width: 120px;
            color: #555;
        }

        /* Vùng hiển thị thành công */
        #success-message {
            display: none;
            text-align: center;
        }
        #success-message h2 { color: #28a745; }
        
        .toggle-password {
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 35px;
            color: #666;
            user-select: none;
        }
        .password-container {
            position: relative;
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>Đăng Ký Tài Khoản</h2>

        <div class="progress-container">
            <div class="progress-line" id="progress-line"></div>
            <div class="step-circle active">1</div>
            <div class="step-circle">2</div>
            <div class="step-circle">3</div>
        </div>

        <form id="multiStepForm">
            
            <div class="form-step active" id="step1">
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" placeholder="Nhập họ và tên">
                    <span class="error-message" id="fullname-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="dob">Ngày sinh</label>
                    <input type="date" id="dob">
                    <span class="error-message" id="dob-error"></span>
                </div>

                <div class="form-group">
                    <label>Giới tính</label>
                    <div class="radio-group">
                        <div><input type="radio" id="male" name="gender" value="Nam"> <label for="male">Nam</label></div>
                        <div><input type="radio" id="female" name="gender" value="Nữ"> <label for="female">Nữ</label></div>
                        <div><input type="radio" id="other" name="gender" value="Khác"> <label for="other">Khác</label></div>
                    </div>
                    <span class="error-message" id="gender-error"></span>
                </div>
            </div>

            <div class="form-step" id="step2">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="name@domain.com">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group password-container">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu (Ít nhất 6 ký tự)">
                    <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group password-container">
                    <label for="confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu">
                    <span class="toggle-password" onclick="togglePassword('confirm-password')">👁️</span>
                    <span class="error-message" id="confirm-password-error"></span>
                </div>
            </div>

            <div class="form-step" id="step3">
                <p>Vui lòng kiểm tra lại thông tin trước khi hoàn tất:</p>
                <div class="summary-box">
                    <div class="summary-item"><strong>Họ và tên:</strong> <span id="sum-name"></span></div>
                    <div class="summary-item"><strong>Ngày sinh:</strong> <span id="sum-dob"></span></div>
                    <div class="summary-item"><strong>Giới tính:</strong> <span id="sum-gender"></span></div>
                    <div class="summary-item"><strong>Email:</strong> <span id="sum-email"></span></div>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-prev" id="btnPrev">Quay lại</button>
                <button type="button" class="btn-next" id="btnNext">Tiếp theo</button>
                <button type="submit" class="btn-submit" id="btnSubmit" style="display: none;">Hoàn tất</button>
            </div>
            
        </form>
    </div>

    <div class="container" id="success-message">
        <h2>🎉 Đăng ký thành công!</h2>
        <p>Chào mừng <strong id="success-name"></strong> đã gia nhập.</p>
    </div>

    <script>
        // --- CÁC BIẾN TOÀN CỤC ---
        let currentStep = 0; // Bắt đầu từ bước 0 (step 1)
        const formSteps = document.querySelectorAll('.form-step');
        const stepCircles = document.querySelectorAll('.step-circle');
        const progressLine = document.getElementById('progress-line');
        
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnSubmit = document.getElementById('btnSubmit');

        // --- HÀM TIỆN ÍCH HIỂN THỊ LỖI ---
        function showError(id, message) {
            const el = document.getElementById(id);
            const err = document.getElementById(id + '-error');
            err.textContent = message;
            err.style.display = 'block';
            if(el.type !== 'radio') {
                el.classList.add('input-error');
                el.classList.remove('input-success');
            }
        }

        function setSuccess(id) {
            const el = document.getElementById(id);
            const err = document.getElementById(id + '-error');
            if(err) err.style.display = 'none';
            if(el && el.type !== 'radio') {
                el.classList.remove('input-error');
                el.classList.add('input-success');
            }
        }

        // --- CÁC HÀM VALIDATE TỪNG TRƯỜNG ---
        // Validate Bước 1
        function validateStep1() {
            let isValid = true;
            
            // Validate Họ tên
            const name = document.getElementById('fullname').value.trim();
            if (name === '') { showError('fullname', 'Họ tên không được để trống'); isValid = false; }
            else if (name.length < 3) { showError('fullname', 'Họ tên phải >= 3 ký tự'); isValid = false; }
            else { setSuccess('fullname'); }

            // Validate Ngày sinh
            const dob = document.getElementById('dob').value;
            if (dob === '') { showError('dob', 'Vui lòng chọn ngày sinh'); isValid = false; }
            else { setSuccess('dob'); }

            // Validate Giới tính
            const gender = document.querySelector('input[name="gender"]:checked');
            if (!gender) { showError('gender', 'Vui lòng chọn giới tính'); isValid = false; }
            else { setSuccess('gender'); }

            return isValid;
        }

        // Validate Bước 2
        function validateStep2() {
            let isValid = true;

            // Validate Email
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '') { showError('email', 'Email không được để trống'); isValid = false; }
            else if (!emailRegex.test(email)) { showError('email', 'Email không hợp lệ'); isValid = false; }
            else { setSuccess('email'); }

            // Validate Mật khẩu
            const pass = document.getElementById('password').value.trim();
            if (pass === '') { showError('password', 'Mật khẩu không được để trống'); isValid = false; }
            else if (pass.length < 6) { showError('password', 'Mật khẩu phải >= 6 ký tự'); isValid = false; }
            else { setSuccess('password'); }

            // Validate Xác nhận mật khẩu
            const confirmPass = document.getElementById('confirm-password').value.trim();
            if (confirmPass === '') { showError('confirm-password', 'Vui lòng xác nhận mật khẩu'); isValid = false; }
            else if (confirmPass !== pass) { showError('confirm-password', 'Mật khẩu không khớp'); isValid = false; }
            else { setSuccess('confirm-password'); }

            return isValid;
        }

        // --- KIỂM TRA TRẠNG THÁI NÚT "TIẾP THEO" ---
        // Hàm này chạy mỗi khi người dùng nhập liệu để quyết định xem có sáng nút Tiếp Theo lên không
        function checkStepCompletion() {
            let isComplete = false;
            if (currentStep === 0) {
                // Kiểm tra sơ bộ xem các trường có dữ liệu không (không hiển thị lỗi ngay)
                const name = document.getElementById('fullname').value.trim().length >= 3;
                const dob = document.getElementById('dob').value !== '';
                const gender = document.querySelector('input[name="gender"]:checked') !== null;
                isComplete = name && dob && gender;
            } else if (currentStep === 1) {
                const email = document.getElementById('email').value.trim() !== '';
                const pass = document.getElementById('password').value.trim().length >= 6;
                const confirm = document.getElementById('confirm-password').value.trim() !== '';
                // Ràng buộc khớp mật khẩu
                const passMatch = document.getElementById('password').value.trim() === document.getElementById('confirm-password').value.trim();
                isComplete = email && pass && confirm && passMatch;
            }

            // Kích hoạt hoặc vô hiệu hóa nút
            if (isComplete) {
                btnNext.classList.add('enabled');
                btnNext.disabled = false;
                btnSubmit.classList.add('enabled');
                btnSubmit.disabled = false;
            } else {
                btnNext.classList.remove('enabled');
                btnNext.disabled = true;
                btnSubmit.classList.remove('enabled');
                btnSubmit.disabled = true;
            }
        }

        // Lắng nghe sự kiện nhập liệu ở tất cả các trường để gọi checkStepCompletion
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', checkStepCompletion);
            input.addEventListener('change', checkStepCompletion); // Cho radio và date
        });


        // --- HÀM CẬP NHẬT GIAO DIỆN (ĐỔI BƯỚC) ---
        function updateFormUI() {
            // 1. Hiển thị Form Step tương ứng
            formSteps.forEach((step, index) => {
                step.classList.toggle('active', index === currentStep);
            });

            // 2. Cập nhật các Vòng tròn bước (Step Circles)
            stepCircles.forEach((circle, index) => {
                // Remove active first
                circle.classList.remove('active');
                
                if (index < currentStep) {
                    circle.classList.add('completed');
                } else if (index === currentStep) {
                    circle.classList.remove('completed');
                    circle.classList.add('active');
                } else {
                    circle.classList.remove('completed');
                }
            });

            // 3. Cập nhật thanh tiến trình chạy ngang
            const progressPercentage = (currentStep / (stepCircles.length - 1)) * 100;
            progressLine.style.width = progressPercentage + '%';

            // 4. Ẩn/Hiện nút bấm
            if (currentStep === 0) {
                btnPrev.style.visibility = 'hidden';
            } else {
                btnPrev.style.visibility = 'visible';
            }

            // Nếu ở bước cuối, ẩn "Tiếp theo", hiện "Hoàn tất"
            if (currentStep === formSteps.length - 1) {
                btnNext.style.display = 'none';
                btnSubmit.style.display = 'inline-block';
                populateSummary(); // Điền dữ liệu vào màn hình xác nhận
            } else {
                btnNext.style.display = 'inline-block';
                btnSubmit.style.display = 'none';
            }

            // Kiểm tra lại trạng thái nút khi chuyển bước (vì người dùng có thể quay lại)
            checkStepCompletion();
        }

        // Hàm đưa dữ liệu đã nhập vào Bước 3
        function populateSummary() {
            document.getElementById('sum-name').textContent = document.getElementById('fullname').value;
            
            // Format ngày sinh d/m/y
            const dObj = new Date(document.getElementById('dob').value);
            document.getElementById('sum-dob').textContent = `${dObj.getDate()}/${dObj.getMonth()+1}/${dObj.getFullYear()}`;
            
            const genderNode = document.querySelector('input[name="gender"]:checked');
            document.getElementById('sum-gender').textContent = genderNode ? genderNode.value : '';
            
            document.getElementById('sum-email').textContent = document.getElementById('email').value;
        }


        // --- SỰ KIỆN CLICK NÚT ---

        btnNext.addEventListener('click', () => {
            // Validate lại lần nữa ngay lúc bấm để hiển thị lỗi đỏ nếu cố tình bypass bằng F12
            let valid = false;
            if (currentStep === 0) valid = validateStep1();
            if (currentStep === 1) valid = validateStep2();

            if (valid) {
                currentStep++;
                updateFormUI();
            }
        });

        btnPrev.addEventListener('click', () => {
            // Khi nhấn Quay lại, dữ liệu tự động được giữ nguyên do HTML không bị reload
            currentStep--;
            updateFormUI();
        });

        // Xử lý Submit Form
        document.getElementById('multiStepForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Thành công
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('success-name').textContent = document.getElementById('fullname').value;
        });

        // Toggle hiển thị mật khẩu
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        // Gọi lần đầu để thiết lập trạng thái khởi tạo
        updateFormUI();

    </script>
</body>
</html>
