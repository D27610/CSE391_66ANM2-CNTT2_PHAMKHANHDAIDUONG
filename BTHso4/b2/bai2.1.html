<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.1 - Form Đăng Ký</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        
        /* Quy tắc hiển thị viền lỗi/hợp lệ */
        .input-error {
            border: 2px solid red !important;
        }
        .input-success {
            border: 2px solid green !important;
        }
        
        /* Quy tắc hiển thị thông báo lỗi */
        .error {
            color: red;
            font-size: 0.85em;
            display: none; /* Mặc định ẩn */
            margin-top: 5px;
        }

        .gender-options {
            display: flex;
            gap: 15px;
        }
        .gender-options label {
            font-weight: normal;
            display: inline;
        }

        .terms-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .terms-group label {
            font-weight: normal;
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }

        /* Vùng hiển thị thành công */
        #success-section {
            display: none;
            text-align: center;
        }
        #success-section h2 {
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container" id="form-section">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm" novalidate>
            
            <div class="form-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên">
                <span class="error" id="fullname-error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@domain.com">
                <span class="error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" placeholder="Ví dụ: 0987654321">
                <span class="error" id="phone-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
                <span class="error" id="password-error"></span>
            </div>

            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu">
                <span class="error" id="confirm-password-error"></span>
            </div>

            <div class="form-group">
                <label>Giới tính</label>
                <div class="gender-options">
                    <div>
                        <input type="radio" id="male" name="gender" value="Nam">
                        <label for="male">Nam</label>
                    </div>
                    <div>
                        <input type="radio" id="female" name="gender" value="Nữ">
                        <label for="female">Nữ</label>
                    </div>
                </div>
                <span class="error" id="gender-error"></span>
            </div>

            <div class="form-group">
                <div class="terms-group">
                    <input type="checkbox" id="terms">
                    <label for="terms">Tôi đồng ý với các điều khoản</label>
                </div>
                <span class="error" id="terms-error"></span>
            </div>

            <button type="submit">Đăng ký</button>
        </form>
    </div>

    <div class="container" id="success-section">
        <h2>Đăng ký thành công! 🎉</h2>
        <p>Chào mừng, <strong id="display-name"></strong>!</p>
    </div>

    <script>
        // --- CÁC HÀM TIỆN ÍCH (UTILITIES) ---

        // Hàm hiển thị lỗi
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorSpan = document.getElementById(fieldId + '-error');
            
            // Hiện text lỗi
            errorSpan.textContent = message;
            errorSpan.style.display = 'block';
            
            // Viền đỏ (chỉ áp dụng cho input text/email/password/tel)
            if (field && field.type !== 'radio' && field.type !== 'checkbox') {
                field.classList.remove('input-success');
                field.classList.add('input-error');
            }
        }

        // Hàm đặt trạng thái hợp lệ (viền xanh, ẩn lỗi)
        function setSuccess(fieldId) {
            const field = document.getElementById(fieldId);
            const errorSpan = document.getElementById(fieldId + '-error');
            
            // Ẩn text lỗi
            if(errorSpan) {
                errorSpan.style.display = 'none';
                errorSpan.textContent = '';
            }
            
            // Viền xanh (chỉ áp dụng cho input text/email/password/tel)
            if (field && field.type !== 'radio' && field.type !== 'checkbox') {
                field.classList.remove('input-error');
                field.classList.add('input-success');
            }
        }

        // Hàm xóa lỗi (khi người dùng đang gõ lại)
        function clearError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorSpan = document.getElementById(fieldId + '-error');
            
            if(errorSpan) errorSpan.style.display = 'none';
            
            if (field && field.type !== 'radio' && field.type !== 'checkbox') {
                field.classList.remove('input-error');
                field.classList.remove('input-success'); // Bỏ viền xanh trong lúc đang gõ lại
            }
        }

        // --- CÁC HÀM VALIDATE TỪNG TRƯỜNG ---

        function validateFullname() {
            const id = 'fullname';
            const val = document.getElementById(id).value.trim();
            const regex = /^[a-zA-ZÀ-ỹ\s]+$/; // Chỉ chữ cái tiếng Việt và khoảng trắng

            if (val === '') {
                showError(id, 'Họ và tên không được để trống.');
                return false;
            }
            if (val.length < 3) {
                showError(id, 'Họ và tên phải có ít nhất 3 ký tự.');
                return false;
            }
            if (!regex.test(val)) {
                showError(id, 'Họ và tên chỉ được chứa chữ cái và khoảng trắng.');
                return false;
            }
            
            setSuccess(id);
            return true;
        }

        function validateEmail() {
            const id = 'email';
            const val = document.getElementById(id).value.trim();
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (val === '') {
                showError(id, 'Email không được để trống.');
                return false;
            }
            if (!regex.test(val)) {
                showError(id, 'Email không đúng định dạng (vd: name@domain.com).');
                return false;
            }

            setSuccess(id);
            return true;
        }

        function validatePhone() {
            const id = 'phone';
            const val = document.getElementById(id).value.trim();
            const regex = /^0[0-9]{9}$/;

            if (val === '') {
                showError(id, 'Số điện thoại không được để trống.');
                return false;
            }
            if (!regex.test(val)) {
                showError(id, 'Số điện thoại phải gồm 10 chữ số và bắt đầu bằng 0.');
                return false;
            }

            setSuccess(id);
            return true;
        }

        function validatePassword() {
            const id = 'password';
            const val = document.getElementById(id).value.trim();
            // Tối thiểu 8 ký tự, 1 chữ thường, 1 chữ hoa, 1 số
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

            if (val === '') {
                showError(id, 'Mật khẩu không được để trống.');
                return false;
            }
            if (!regex.test(val)) {
                showError(id, 'Mật khẩu ≥ 8 ký tự, gồm ít nhất 1 chữ hoa, 1 chữ thường, 1 số.');
                return false;
            }

            setSuccess(id);
            // Kích hoạt kiểm tra lại "Xác nhận mật khẩu" nếu nó đã có dữ liệu
            const confirmVal = document.getElementById('confirm-password').value.trim();
            if (confirmVal !== '') validateConfirmPassword(); 

            return true;
        }

        function validateConfirmPassword() {
            const id = 'confirm-password';
            const val = document.getElementById(id).value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            if (val === '') {
                showError(id, 'Vui lòng xác nhận lại mật khẩu.');
                return false;
            }
            if (val !== passwordVal) {
                showError(id, 'Mật khẩu xác nhận không khớp.');
                return false;
            }

            setSuccess(id);
            return true;
        }

        function validateGender() {
            const id = 'gender';
            const checked = document.querySelector('input[name="gender"]:checked');
            
            if (!checked) {
                showError(id, 'Vui lòng chọn giới tính.');
                return false;
            }

            setSuccess(id);
            return true;
        }

        function validateTerms() {
            const id = 'terms';
            const isChecked = document.getElementById(id).checked;

            if (!isChecked) {
                showError(id, 'Bạn phải đồng ý với điều khoản.');
                return false;
            }

            setSuccess(id);
            return true;
        }

        // --- GẮN SỰ KIỆN (EVENT LISTENERS) ---

        // 1. Gắn sự kiện BLUR (Validate khi rời khỏi ô) và INPUT (Xóa lỗi ngay khi nhập lại)
        const inputs = [
            { id: 'fullname', validator: validateFullname },
            { id: 'email', validator: validateEmail },
            { id: 'phone', validator: validatePhone },
            { id: 'password', validator: validatePassword },
            { id: 'confirm-password', validator: validateConfirmPassword }
        ];

        inputs.forEach(item => {
            const el = document.getElementById(item.id);
            // Validate ngay khi rời khỏi trường
            el.addEventListener('blur', item.validator);
            // Xóa thông báo lỗi, xóa viền đỏ khi người dùng bắt đầu nhập lại
            el.addEventListener('input', () => clearError(item.id));
        });

        // 2. Gắn sự kiện CHANGE cho Radio và Checkbox
        const radios = document.querySelectorAll('input[name="gender"]');
        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                clearError('gender');
                validateGender();
            });
        });

        document.getElementById('terms').addEventListener('change', () => {
            clearError('terms');
            validateTerms();
        });


        // 3. Xử lý khi nhấn Submit toàn bộ Form
        const form = document.getElementById('registerForm');
        
        form.addEventListener('submit', function(event) {
            // Ngăn chặn hành động submit mặc định
            event.preventDefault();

            // Gọi tất cả các hàm validate và dùng toán tử bitwise `&` 
            // Toán tử `&` đảm bảo mọi hàm đều được chạy (không bị ngắt sớm như `&&`), 
            // qua đó hiển thị toàn bộ lỗi cùng lúc nếu có.
            const isFormValid = validateFullname() 
                              & validateEmail() 
                              & validatePhone() 
                              & validatePassword() 
                              & validateConfirmPassword() 
                              & validateGender() 
                              & validateTerms();

            // isFormValid sẽ trả về 1 (true) nếu tất cả đều true, và 0 (false) nếu có ít nhất 1 lỗi
            if (isFormValid) {
                // Thành công: Ẩn form, hiện thông báo
                document.getElementById('form-section').style.display = 'none';
                document.getElementById('success-section').style.display = 'block';
                
                // Hiển thị tên người dùng
                const fullnameInput = document.getElementById('fullname').value;
                document.getElementById('display-name').textContent = fullnameInput;
            }
        });
    </script>
</body>
</html>
